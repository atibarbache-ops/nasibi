<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>إنشاء حساب - Nasibi</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #fff5f8;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 500px;
      background: white;
      padding: 30px 25px;
      border-radius: 20px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.10);
    }

    h1 {
      text-align: center;
      color: #ff4f87;
      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 7px;
      font-weight: bold;
      color: #444;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
      font-family: Arial, sans-serif;
      background: white;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: #ff4f87;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    #age {
      margin-top: 8px;
      font-size: 14px;
      min-height: 20px;
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: #ff4f87;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      background: #e83d73;
    }

    button:disabled {
      background: #ccc;
      cursor: not-allowed;
    }

    #message {
      text-align: center;
      margin-top: 15px;
      font-size: 14px;
      font-weight: bold;
      min-height: 20px;
    }

    .login-link {
      text-align: center;
      margin-top: 20px;
      color: #777;
    }

    .login-link a {
      color: #ff4f87;
      text-decoration: none;
      font-weight: bold;
    }

  </style>

</head>


<body>

  <div class="container">

    <h1>💗 Nasibi</h1>

    <div class="subtitle">
      إنشاء حساب جديد
    </div>


    <!-- الاسم -->

    <label for="name">
      الاسم الكامل
    </label>

    <input
      type="text"
      id="name"
      placeholder="اكتبي اسمك"
      autocomplete="name"
    >


    <!-- تاريخ الميلاد -->

    <label for="birthDate">
      تاريخ الميلاد
    </label>

    <input
      type="date"
      id="birthDate"
    >

    <div id="age"></div>


    <!-- الجنس -->

    <label for="gender">
      الجنس
    </label>

    <select id="gender">

      <option value="">
        اختاري الجنس
      </option>

      <option value="أنثى">
        أنثى
      </option>

      <option value="ذكر">
        ذكر
      </option>

    </select>


    <!-- الولاية -->

    <label for="wilaya">
      الولاية
    </label>

    <select id="wilaya">

      <option value="">
        اختاري الولاية
      </option>

      <option value="أدرار">أدرار</option>
      <option value="الشلف">الشلف</option>
      <option value="الأغواط">الأغواط</option>
      <option value="أم البواقي">أم البواقي</option>
      <option value="باتنة">باتنة</option>
      <option value="بجاية">بجاية</option>
      <option value="بسكرة">بسكرة</option>
      <option value="بشار">بشار</option>
      <option value="البليدة">البليدة</option>
      <option value="البويرة">البويرة</option>
      <option value="تمنراست">تمنراست</option>
      <option value="تبسة">تبسة</option>
      <option value="تلمسان">تلمسان</option>
      <option value="تيارت">تيارت</option>
      <option value="تيزي وزو">تيزي وزو</option>
      <option value="الجزائر">الجزائر</option>
      <option value="الجلفة">الجلفة</option>
      <option value="جيجل">جيجل</option>
      <option value="سطيف">سطيف</option>
      <option value="سعيدة">سعيدة</option>
      <option value="سكيكدة">سكيكدة</option>
      <option value="سيدي بلعباس">سيدي بلعباس</option>
      <option value="عنابة">عنابة</option>
      <option value="قالمة">قالمة</option>
      <option value="قسنطينة">قسنطينة</option>
      <option value="المدية">المدية</option>
      <option value="مستغانم">مستغانم</option>
      <option value="المسيلة">المسيلة</option>
      <option value="معسكر">معسكر</option>
      <option value="ورقلة">ورقلة</option>
      <option value="وهران">وهران</option>
      <option value="البيض">البيض</option>
      <option value="إليزي">إليزي</option>
      <option value="برج بوعريريج">برج بوعريريج</option>
      <option value="بومرداس">بومرداس</option>
      <option value="الطارف">الطارف</option>
      <option value="تندوف">تندوف</option>
      <option value="تيسمسيلت">تيسمسيلت</option>
      <option value="الوادي">الوادي</option>
      <option value="خنشلة">خنشلة</option>
      <option value="سوق أهراس">سوق أهراس</option>
      <option value="تيبازة">تيبازة</option>
      <option value="ميلة">ميلة</option>
      <option value="عين الدفلى">عين الدفلى</option>
      <option value="النعامة">النعامة</option>
      <option value="عين تموشنت">عين تموشنت</option>
      <option value="غرداية">غرداية</option>
      <option value="غليزان">غليزان</option>

    </select>


    <!-- المدينة -->

    <label for="city">
      المدينة
    </label>

    <input
      type="text"
      id="city"
      placeholder="اكتبي مدينتك"
    >


    <!-- البريد -->

    <label for="email">
      البريد الإلكتروني
    </label>

    <input
      type="email"
      id="email"
      placeholder="example@gmail.com"
      autocomplete="email"
    >


    <!-- كلمة السر -->

    <label for="password">
      كلمة السر
    </label>

    <input
      type="password"
      id="password"
      placeholder="6 أحرف على الأقل"
      autocomplete="new-password"
    >


    <!-- نبذة -->

    <label for="bio">
      نبذة عنك
    </label>

    <textarea
      id="bio"
      placeholder="اكتبي نبذة قصيرة عنك..."
    ></textarea>


    <!-- زر إنشاء الحساب -->

    <button
      type="button"
      id="createAccount">

      إنشاء الحساب 💗

    </button>


    <!-- الرسالة -->

    <div id="message"></div>


    <!-- تسجيل الدخول -->

    <div class="login-link">

      عندك حساب من قبل؟

      <a href="login.html">
        تسجيل الدخول
      </a>

    </div>

  </div>


  <!-- =========================
       Firebase
  ========================== -->

  <script type="module">

    import {
      auth,
      db
    } from "./firebase-config.js";


    import {
      createUserWithEmailAndPassword
    } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


    import {
      doc,
      setDoc,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


    /* =========================
       العناصر
    ========================== */

    const nameInput =
      document.getElementById("name");

    const birthDate =
      document.getElementById("birthDate");

    const ageElement =
      document.getElementById("age");

    const gender =
      document.getElementById("gender");

    const wilaya =
      document.getElementById("wilaya");

    const city =
      document.getElementById("city");

    const email =
      document.getElementById("email");

    const password =
      document.getElementById("password");

    const bio =
      document.getElementById("bio");

    const createAccount =
      document.getElementById("createAccount");

    const message =
      document.getElementById("message");


    let userAge = 0;


    /* =========================
       رسالة
    ========================== */

    function showMessage(text, color) {

      message.textContent = text;
      message.style.color = color;

    }


    /* =========================
       حساب العمر
    ========================== */

    function calculateAge() {

      if (!birthDate.value) {

        userAge = 0;

        ageElement.textContent = "";

        return;

      }


      const today = new Date();

      const birth = new Date(
        birthDate.value + "T00:00:00"
      );


      let years =
        today.getFullYear() -
        birth.getFullYear();


      const monthDifference =
        today.getMonth() -
        birth.getMonth();


      if (
        monthDifference < 0 ||
        (
          monthDifference === 0 &&
          today.getDate() < birth.getDate()
        )
      ) {

        years--;

      }


      userAge = years;


      if (years >= 18) {

        ageElement.textContent =
          "✅ عمرك: " + years + " سنة";

        ageElement.style.color =
          "green";

      } else {

        ageElement.textContent =
          "❌ التسجيل مسموح لمن عمره 18 سنة أو أكثر";

        ageElement.style.color =
          "red";

      }

    }


    /* =========================
       تغيير تاريخ الميلاد
    ========================== */

    birthDate.addEventListener(
      "change",
      function () {

        calculateAge();

      }
    );


    /* =========================
       إنشاء الحساب
    ========================== */

    createAccount.addEventListener(
      "click",
      async function () {


        showMessage("", "");


        /* حساب العمر من جديد */

        calculateAge();


        /* =========================
           التحقق من الاسم
        ========================== */

        if (
          nameInput.value.trim() === ""
        ) {

          showMessage(
            "⚠️ اكتبي الاسم الكامل",
            "red"
          );

          nameInput.focus();

          return;

        }


        /* =========================
           التحقق من تاريخ الميلاد
        ========================== */

        if (
          birthDate.value === ""
        ) {

          showMessage(
            "⚠️ اختاري تاريخ الميلاد",
            "red"
          );

          birthDate.focus();

          return;

        }


        /* =========================
           التحقق من العمر
        ========================== */

        if (
          userAge < 18
        ) {

          showMessage(
            "❌ يجب أن يكون عمرك 18 سنة أو أكثر",
            "red"
          );

          return;

        }


        /* =========================
           الجنس
        ========================== */

        if (
          gender.value === ""
        ) {

          showMessage(
            "⚠️ اختاري الجنس",
            "red"
          );

          gender.focus();

          return;

        }


        /* =========================
           الولاية
        ========================== */

        if (
          wilaya.value === ""
        ) {

          showMessage(
            "⚠️ اختاري الولاية",
            "red"
          );

          wilaya.focus();

          return;

        }


        /* =========================
           المدينة
        ========================== */

        if (
          city.value.trim() === ""
        ) {

          showMessage(
            "⚠️ اكتبي المدينة",
            "red"
          );

          city.focus();

          return;

        }


        /* =========================
           البريد
        ========================== */

        const emailValue =
          email.value.trim();


        if (
          emailValue === ""
        ) {

          showMessage(
            "⚠️ اكتبي البريد الإلكتروني",
            "red"
          );

          email.focus();

          return;

        }


        /* التحقق من شكل البريد */

        const emailPattern =
          /^[^\s@]+@[^\s@]+\.[^\s@]+$/;


        if (
          !emailPattern.test(emailValue)
        ) {

          showMessage(
            "❌ البريد الإلكتروني غير صحيح",
            "red"
          );

          email.focus();

          return;

        }


        /* =========================
           كلمة السر
        ========================== */

        if (
          password.value === ""
        ) {

          showMessage(
            "⚠️ اكتبي كلمة السر",
            "red"
          );

          password.focus();

          return;

        }


        if (
          password.value.length < 6
        ) {

          showMessage(
            "❌ كلمة السر يجب أن تحتوي على 6 أحرف على الأقل",
            "red"
          );

          password.focus();

          return;

        }


        /* =========================
           تعطيل الزر أثناء التسجيل
        ========================== */

        createAccount.disabled = true;

        createAccount.textContent =
          "⏳ جاري إنشاء الحساب...";


        try {


          /* =========================
             إنشاء المستخدم في Firebase Auth
          ========================== */

          const userCredential =
            await createUserWithEmailAndPassword(
              auth,
              emailValue,
              password.value
            );


          const user =
            userCredential.user;


          /* =========================
             بيانات المستخدم
          ========================== */

          const userData = {

            uid:
              user.uid,

            name:
              nameInput.value.trim(),

            birthDate:
              birthDate.value,

            age:
              userAge,

            gender:
              gender.value,

            wilaya:
              wilaya.value,

            city:
              city.value.trim(),

            email:
              emailValue,

            bio:
              bio.value.trim(),

            createdAt:
              serverTimestamp()

          };


          /* =========================
             حفظ البيانات في Firestore
          ========================== */

          await setDoc(

            doc(
              db,
              "users",
              user.uid
            ),

            userData

          );


          /* =========================
             حفظ بيانات محلية
          ========================== */

          localStorage.setItem(
            "userUid",
            user.uid
          );

          localStorage.setItem(
            "userName",
            nameInput.value.trim()
          );

          localStorage.setItem(
            "userAge",
            String(userAge)
          );

          localStorage.setItem(
            "userGender",
            gender.value
          );

          localStorage.setItem(
            "userWilaya",
            wilaya.value
          );

          localStorage.setItem(
            "userCity",
            city.value.trim()
          );

          localStorage.setItem(
            "userEmail",
            emailValue
          );

          localStorage.setItem(
            "userBio",
            bio.value.trim()
          );

          localStorage.setItem(
            "isLoggedIn",
            "true"
          );


          /* =========================
             نجاح
          ========================== */

          showMessage(
            "✅ تم إنشاء الحساب بنجاح!",
            "green"
          );


          createAccount.textContent =
            "✅ تم إنشاء الحساب";


          /* =========================
             الانتقال إلى Profile
          ========================== */

          setTimeout(
            function () {

              window.location.href =
                "profile.html";

            },
            1000
          );


        } catch (error) {

          console.error(
            "Firebase Register Error:",
            error
          );


          /* =========================
             أخطاء Firebase Auth
          ========================== */

          if (
            error.code ===
            "auth/email-already-in-use"
          ) {

            showMessage(
              "❌ هذا البريد الإلكتروني مستعمل من قبل",
              "red"
            );

          }

          else if (
            error.code ===
            "auth/invalid-email"
          ) {

            showMessage(
              "❌ البريد الإلكتروني غير صحيح",
              "red"
            );

          }

          else if (
            error.code ===
            "auth/weak-password"
          ) {

            showMessage(
              "❌ كلمة السر ضعيفة، استعملي 6 أحرف أو أكثر",
              "red"
            );

          }

          else if (
            error.code ===
            "auth/network-request-failed"
          ) {

            showMessage(
              "❌ ماكانش اتصال بالإنترنت",
              "red"
            );

          }

          else if (
            error.code ===
            "auth/operation-not-allowed"
          ) {

            showMessage(
              "❌ تسجيل الدخول بالبريد الإلكتروني غير مفعّل في Firebase",
              "red"
            );

          }

          else if (
            error.code ===
            "permission-denied" ||
            error.code ===
            "firestore/permission-denied"
          ) {

            showMessage(
              "❌ الحساب تسجل، لكن Firestore رفض حفظ البيانات. لازم نصلح Rules.",
              "red"
            );

          }

          else {

            showMessage(
              "❌ حدث خطأ أثناء إنشاء الحساب",
              "red"
            );

          }


          /* إعادة الزر */

          createAccount.disabled =
            false;

          createAccount.textContent =
            "إنشاء الحساب 💗";

        }

      }
    );


    /* =========================
       منع Enter من أي تصرف غريب
    ========================== */

    document.addEventListener(
      "keydown",
      function (event) {

        if (
          event.key === "Enter" &&
          document.activeElement !== bio
        ) {

          event.preventDefault();

        }

      }
    );

  </script>

</body>

</html>

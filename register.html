<!DOCTYPE html><html lang="ar" dir="rtl"><head>
    <meta charset="UTF-8"><meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>إنشاء حساب - نصيبي</title>

<link rel="stylesheet" href="style.css">

</head><body><div class="register"><h2>إنشاء حساب 💍</h2>

<input
    type="text"
    id="name"
    placeholder="الاسم">

<label>تاريخ الميلاد</label>

<input
    type="date"
    id="birthdate">

<p id="age"></p>

<label>الجنس</label>

<select id="gender">
    <option value="">اختر الجنس</option>
    <option value="رجل">رجل</option>
    <option value="امرأة">امرأة</option>
</select>

<label>الولاية</label>

<select id="wilaya">

    <option value="">اختر ولايتك</option>

    <option>أدرار</option>
    <option>الشلف</option>
    <option>الأغواط</option>
    <option>أم البواقي</option>
    <option>باتنة</option>
    <option>بجاية</option>
    <option>بسكرة</option>
    <option>بشار</option>
    <option>البليدة</option>
    <option>البويرة</option>
    <option>تمنراست</option>
    <option>تبسة</option>
    <option>تلمسان</option>
    <option>تيارت</option>
    <option>تيزي وزو</option>
    <option>الجزائر</option>
    <option>الجلفة</option>
    <option>جيجل</option>
    <option>سطيف</option>
    <option>سعيدة</option>
    <option>سكيكدة</option>
    <option>سيدي بلعباس</option>
    <option>عنابة</option>
    <option>قالمة</option>
    <option>قسنطينة</option>
    <option>المدية</option>
    <option>مستغانم</option>
    <option>المسيلة</option>
    <option>معسكر</option>
    <option>ورقلة</option>
    <option>وهران</option>
    <option>البيض</option>
    <option>إليزي</option>
    <option>برج بوعريريج</option>
    <option>بومرداس</option>
    <option>الطارف</option>
    <option>تندوف</option>
    <option>تيسمسيلت</option>
    <option>الوادي</option>
    <option>خنشلة</option>
    <option>سوق أهراس</option>
    <option>تيبازة</option>
    <option>ميلة</option>
    <option>عين الدفلى</option>
    <option>النعامة</option>
    <option>عين تموشنت</option>
    <option>غرداية</option>
    <option>غليزان</option>
    <option>تيميمون</option>
    <option>برج باجي مختار</option>
    <option>أولاد جلال</option>
    <option>بني عباس</option>
    <option>عين صالح</option>
    <option>عين قزام</option>
    <option>تقرت</option>
    <option>جانت</option>
    <option>المغير</option>
    <option>المنيعة</option>

</select>

<input
    type="text"
    id="city"
    placeholder="المدينة">

<input
    type="email"
    id="email"
    placeholder="البريد الإلكتروني">

<input
    type="password"
    id="password"
    placeholder="كلمة السر">

<label>نبذة عنك</label>

<textarea
    id="bio"
    placeholder="اكتب نبذة قصيرة عن نفسك..."
    rows="5"></textarea>

<label>صورتك الشخصية</label>

<input
    type="file"
    id="profilePhoto"
    accept="image/*">

<button
    id="createAccount"
    type="button"
    disabled>

    إنشاء الحساب 💗

</button>

</div><script type="module">

/* =========================
   Firebase
========================= */

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getAuth,
    createUserWithEmailAndPassword
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


const firebaseConfig = {

    apiKey: "AIzaSyBkjw6UKO0Mfm5Iu-z3akuITd8CdLqInZs",

    authDomain: "nassibi-f7c52.firebaseapp.com",

    projectId: "nassibi-f7c52",

    storageBucket: "nassibi-f7c52.appspot.com",

    messagingSenderId: "ضع_القيمة_الخاصة_بمشروعك",

    appId: "ضع_القيمة_الخاصة_بمشروعك"

};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);


/* =========================
   العناصر
========================= */

const nameInput =
    document.getElementById("name");

const birthdate =
    document.getElementById("birthdate");

const age =
    document.getElementById("age");

const gender =
    document.getElementById("gender");

const wilaya =
    document.getElementById("wilaya");

const city =
    document.getElementById("city");

const email =
    document.getElementById("email");

const password =
    document.getElementById("password");

const bio =
    document.getElementById("bio");

const profilePhoto =
    document.getElementById("profilePhoto");

const createAccount =
    document.getElementById("createAccount");


let userAge = 0;


/* =========================
   حساب العمر
========================= */

birthdate.addEventListener(
    "change",
    function () {

        const today = new Date();

        const birth = new Date(this.value);

        let years =
            today.getFullYear()
            - birth.getFullYear();

        const month =
            today.getMonth()
            - birth.getMonth();

        if (
            month < 0 ||
            (
                month === 0 &&
                today.getDate()
                < birth.getDate()
            )
        ) {
            years--;
        }

        userAge = years;


        if (years >= 18) {

            age.textContent =
                "✅ عمرك: "
                + years
                + " سنة";

            age.style.color = "green";

            createAccount.disabled = false;

        } else {

            age.textContent =
                "❌ يجب أن يكون عمرك 18 سنة أو أكثر";

            age.style.color = "red";

            createAccount.disabled = true;

        }

    }
);


/* =========================
   الصورة
========================= */

profilePhoto.addEventListener(
    "change",
    function () {

        const file = this.files[0];

        if (file) {

            const reader =
                new FileReader();

            reader.onload =
                function (event) {

                    localStorage.setItem(
                        "userPhoto",
                        event.target.result
                    );

                };

            reader.readAsDataURL(file);
        }

    }
);


/* =========================
   إنشاء الحساب
========================= */

createAccount.addEventListener(
    "click",
    async function () {

        if (userAge < 18) {

            alert(
                "❌ التسجيل مسموح لمن عمره 18 سنة أو أكثر فقط"
            );

            return;
        }


        if (
            nameInput.value.trim() === "" ||
            gender.value === "" ||
            wilaya.value === "" ||
            email.value.trim() === "" ||
            password.value === ""
        ) {

            alert(
                "⚠️ املئي جميع المعلومات المطلوبة"
            );

            return;
        }


        if (password.value.length < 6) {

            alert(
                "⚠️ كلمة السر يجب أن تكون 6 أحرف على الأقل"
            );

            return;
        }


        createAccount.disabled = true;

        createAccount.textContent =
            "جاري إنشاء الحساب...";


        try {

            const userCredential =
                await createUserWithEmailAndPassword(
                    auth,
                    email.value.trim(),
                    password.value
                );


            const user =
                userCredential.user;


            /* حفظ معلومات المستخدم */

            localStorage.setItem(
                "userId",
                user.uid
            );

            localStorage.setItem(
                "userName",
                nameInput.value.trim()
            );

            localStorage.setItem(
                "userAge",
                userAge
            );

            localStorage.setItem(
                "userGender",
                gender.value
            );

            localStorage.setItem(
                "userWilaya",
                wilaya.value
            );

            localStorage.setItem(
                "userCity",
                city.value.trim()
            );

            localStorage.setItem(
                "userEmail",
                email.value.trim()
            );

            localStorage.setItem(
                "userBio",
                bio.value.trim()
            );

            localStorage.setItem(
                "isLoggedIn",
                "true"
            );


            alert(
                "💗 تم إنشاء حسابك بنجاح!"
            );


            window.location.href =
                "profile.html";


        } catch (error) {

            console.error(error);


            createAccount.disabled = false;

            createAccount.textContent =
                "إنشاء الحساب 💗";


            if (
                error.code ===
                "auth/email-already-in-use"
            ) {

                alert(
                    "❌ هذا البريد الإلكتروني مستعمل من قبل"
                );

            } else if (
                error.code ===
                "auth/invalid-email"
            ) {

                alert(
                    "❌ البريد الإلكتروني غير صحيح"
                );

            } else if (
                error.code ===
                "auth/weak-password"
            ) {

                alert(
                    "❌ كلمة السر ضعيفة، لازم تكون 6 أحرف على الأقل"
                );

            } else if (
                error.code ===
                "auth/operation-not-allowed"
            ) {

                alert(
                    "❌ لازم تفعّل Email/Password من Firebase Authentication"
                );

            } else {

                alert(
                    "❌ حدث خطأ أثناء إنشاء الحساب:\n"
                    + error.message
                );

            }

        }

    }
);

</script></body></html>

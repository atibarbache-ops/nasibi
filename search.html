<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>البحث - نصيبي 💍</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="search-page">

    <h1>🔎 ابحث عن شريك حياتك 💍</h1>

    <p>
        تعارف جاد ومحترم 💗
    </p>


    <!-- البحث -->

    <div class="search-box">

        <label>الجنس</label>

        <select id="searchGender">

            <option value="">
                الكل
            </option>

            <option value="رجل">
                رجل
            </option>

            <option value="امرأة">
                امرأة
            </option>

        </select>


        <label>العمر الأدنى</label>

        <input
            type="number"
            id="minAge"
            min="18"
            placeholder="18">


        <label>العمر الأقصى</label>

        <input
            type="number"
            id="maxAge"
            min="18"
            placeholder="40">


        <label>الولاية</label>

        <select id="searchWilaya">

            <option value="">
                كل الولايات
            </option>

            <option>الجزائر</option>
            <option>وهران</option>
            <option>سطيف</option>
            <option>قسنطينة</option>
            <option>باتنة</option>
            <option>بجاية</option>
            <option>البليدة</option>
            <option>عنابة</option>
            <option>تيزي وزو</option>
            <option>بومرداس</option>

        </select>


        <button id="searchBtn">
            🔎 بحث
        </button>

    </div>


    <!-- النتائج -->

    <div
        id="results"
        class="results">
    </div>


    <a
        href="profile.html"
        class="back">

        👤 ملفي الشخصي

    </a>

</div>


<script>

/* =========================
   المستخدمون التجريبيون
========================= */

const users = [

    {
        id: 1,
        name: "أحمد",
        age: 28,
        gender: "رجل",
        wilaya: "الجزائر",
        bio: "أبحث عن شريكة حياة جادة ومحترمة."
    },

    {
        id: 2,
        name: "سارة",
        age: 25,
        gender: "امرأة",
        wilaya: "وهران",
        bio: "أبحث عن شخص جاد لبناء أسرة."
    },

    {
        id: 3,
        name: "محمد",
        age: 32,
        gender: "رجل",
        wilaya: "سطيف",
        bio: "أبحث عن الاستقرار وتكوين أسرة."
    },

    {
        id: 4,
        name: "مريم",
        age: 27,
        gender: "امرأة",
        wilaya: "قسنطينة",
        bio: "أحب الهدوء وأبحث عن علاقة جادة."
    },

    {
        id: 5,
        name: "ياسين",
        age: 30,
        gender: "رجل",
        wilaya: "وهران",
        bio: "أبحث عن شريكة مناسبة للحياة."
    }

];


/* =========================
   العناصر
========================= */

const searchGender =
    document.getElementById(
        "searchGender"
    );

const minAge =
    document.getElementById(
        "minAge"
    );

const maxAge =
    document.getElementById(
        "maxAge"
    );

const searchWilaya =
    document.getElementById(
        "searchWilaya"
    );

const searchBtn =
    document.getElementById(
        "searchBtn"
    );

const results =
    document.getElementById(
        "results"
    );


/* =========================
   الإعجاب
========================= */

function likeUser(userId, button) {

    let likes =
        JSON.parse(
            localStorage.getItem("likes")
        ) || [];


    if (!likes.includes(userId)) {

        likes.push(userId);

        localStorage.setItem(
            "likes",
            JSON.stringify(likes)
        );


        button.textContent =
            "💗 تم الإعجاب";

    } else {

        likes =
            likes.filter(
                id => id !== userId
            );


        localStorage.setItem(
            "likes",
            JSON.stringify(likes)
        );


        button.textContent =
            "❤️ إعجاب";

    }

}


/* =========================
   عرض المستخدمين
========================= */

function showUsers(list) {

    results.innerHTML = "";


    if (list.length === 0) {

        results.innerHTML =
            "<p class='no-results'>❌ لم نجد أشخاصًا بهذه المواصفات</p>";

        return;
    }


    const likes =
        JSON.parse(
            localStorage.getItem("likes")
        ) || [];


    list.forEach(
        function(user) {

            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "user-card";


            card.innerHTML = `

                <div class="user-avatar">
                    👤
                </div>

                <h2>
                    ${user.name}
                </h2>

                <p>
                    🎂 ${user.age} سنة
                </p>

                <p>
                    🚻 ${user.gender}
                </p>

                <p>
                    📍 ${user.wilaya}
                </p>

                <div class="user-bio">
                    ${user.bio}
                </div>

                <button class="like-user">
                    ${
                        likes.includes(user.id)
                        ? "💗 تم الإعجاب"
                        : "❤️ إعجاب"
                    }
                </button>

                <button class="contact-user">
                    💌 تواصل
                </button>

            `;


            const likeButton =
                card.querySelector(
                    ".like-user"
                );


            likeButton.addEventListener(
                "click",
                function() {

                    likeUser(
                        user.id,
                        likeButton
                    );

                }
            );


            const contactButton =
                card.querySelector(
                    ".contact-user"
                );


            contactButton.addEventListener(
                "click",
                function() {

                    localStorage.setItem(
                        "chatUser",
                        user.name
                    );


                    window.location.href =
                        "chat.html";

                }
            );


            results.appendChild(
                card
            );

        }
    );

}


/* =========================
   البحث
========================= */

function searchUsers() {

    const gender =
        searchGender.value;


    const minimum =
        Number(minAge.value) || 18;


    const maximum =
        Number(maxAge.value) || 100;


    const wilaya =
        searchWilaya.value;


    const filtered =
        users.filter(
            function(user) {

                const genderMatch =
                    gender === "" ||
                    user.gender === gender;


                const ageMatch =
                    user.age >= minimum &&
                    user.age <= maximum;


                const wilayaMatch =
                    wilaya === "" ||
                    user.wilaya === wilaya;


                return (
                    genderMatch &&
                    ageMatch &&
                    wilayaMatch
                );

            }
        );


    showUsers(filtered);

}


searchBtn.addEventListener(
    "click",
    searchUsers
);


/* عرض الأشخاص */

showUsers(users);

</script>

</body>

</html>

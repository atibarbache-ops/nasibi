<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>البحث - نصيبي 💍</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

<div class="search-page">

    <h1>🔎 ابحث عن شريك حياتك 💍</h1>

    <p>تعارف جاد ومحترم 💗</p>

        <label>الولاية</label>

        <select id="searchWilaya">

            <option value="">كل الولايات</option>

            <option>أدرار</option>

            <option>البويرة</option>
            <option>تمنراست</option>
            <option>تبسة</option>
            <option>تلمسان</option>
            <option>تيارت</option>
            <option>تيزي وزو</option>
            <option>الجزائر</option>
            <option>الجلفة</option>
            <option>جيجل</option>
            <option>سطيف</option>
            <option>سعيدة</option>
            <option>سكيكدة</option>
            <option>سيدي بلعباس</option>
            <option>عنابة</option>
            <option>قالمة</option>
            <option>قسنطينة</option>
            <option>المدية</option>
            <option>مستغانم</option>
            <option>المسيلة</option>
            <option>معسكر</option>
            <option>ورقلة</option>
            <option>وهران</option>
            <option>البيض</option>
            <option>إليزي</option>
            <option>برج بوعريريج</option>
            <option>بومرداس</option>
            <option>الطارف</option>
            <option>تندوف</option>
            <option>تيسمسيلت</option>
            <option>الوادي</option>
            <option>خنشلة</option>
            <option>سوق أهراس</option>
            <option>تيبازة</option>
            <option>ميلة</option>
            <option>عين الدفلى</option>
            <option>النعامة</option>
            <option>عين تموشنت</option>
            <option>غرداية</option>
            <option>غليزان</option>
            <option>تيميمون</option>
            <option>برج باجي مختار</option>
            <option>أولاد جلال</option>
            <option>بني عباس</option>
            <option>عين صالح</option>
            <option>عين قزام</option>
            <option>تقرت</option>
            <option>جانت</option>
            <option>المغير</option>
            <option>المنيعة</option>

        </select>


        <button
            id="searchBtn"
            type="button">

            🔎 بحث

        </button>

    </div>


    <div id="loading">

        ⏳ جاري تحميل المستخدمين...

    </div>


    <div

        class="results">

    </div>


    <a
        href="profile.html"
        class="back">

        👤 ملفي الشخصي

    </a>

</div>


<script type="module">


/* ==================================================
   FIREBASE
================================================== */

import {
    initializeApp
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {
    getFirestore,
    collection,
    getDocs,
    doc,
    getDoc,
    setDoc,
    deleteDoc
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


import {
    getAuth,
    onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


/* ==================================================
   معلومات Firebase
================================================== */

const firebaseConfig = {

    apiKey:
        "AIzaSyBkjw6UKO0Mfm5Iu-z3akuITd8CdLqInZs",

    authDomain:
        "nassibi-f7c52.firebaseapp.com",

    projectId:
        "nassibi-f7c52",

    storageBucket:
        "nassibi-f7c52.firebasestorage.app",

    messagingSenderId:
        "845547151433",

    appId:
        "1:845547151433:web:0819069e6c353c7672df98"

};


/* تشغيل Firebase */

const app =
    initializeApp(firebaseConfig);


const db =
    getFirestore(app);


const auth =
    getAuth(app);


/* ==================================================
   المستخدم الحالي
================================================== */

let currentUser = null;


onAuthStateChanged(
    auth,
    function(user) {

        currentUser = user;

        console.log(
            "المستخدم الحالي:",
            user
        );

    }
);


/* ==================================================
   عناصر الصفحة
================================================== */

const searchGender =
    document.getElementById(
        "searchGender"
    );


const minAge =
    document.getElementById(
        "minAge"
    );


const maxAge =
    document.getElementById(
        "maxAge"
    );


const searchWilaya =
    document.getElementById(
        "searchWilaya"
    );


const searchBtn =
    document.getElementById(
        "searchBtn"
    );


const results =
    document.getElementById(
        "results"
    );


const loading =
    document.getElementById(
        "loading"
    );


/* ==================================================
   المستخدمين
================================================== */

let users = [];


/* ==================================================
   تحميل المستخدمين من Firestore
================================================== */

async function loadUsers() {

    try {

        loading.style.display =
            "block";

        loading.textContent =
            "⏳ جاري تحميل المستخدمين...";


        const snapshot =
            await getDocs(
                collection(
                    db,
                    "users"
                )
            );


        users = [];


        snapshot.forEach(
            function(documentSnapshot) {

                const data =
                    documentSnapshot.data();


                users.push({

                    id:
                        documentSnapshot.id,

                    ...data

                });

            }
        );


        loading.style.display =
            "none";


        showUsers(users);


        console.log(
            "تم تحميل المستخدمين:",
            users
        );

    }


    catch(error) {

        console.error(
            "Firestore Error:",
            error
        );


        loading.style.display =
            "block";


        loading.textContent =
            "❌ حدث خطأ أثناء تحميل المستخدمين";


        results.innerHTML =

            "<p class='no-results'>" +

            "تأكدي أن Firestore مفعّل وأن مجموعة users موجودة." +

            "</p>";

    }

}


/* ==================================================
   الإعجاب
================================================== */

async function likeUser(
    userId,
    button
) {


    if (!currentUser) {

        alert(
            "⚠️ يجب تسجيل الدخول أولًا للإعجاب"
        );

        return;

    }


    /* لا يمكن الإعجاب بالنفس */

    if (
        currentUser.uid === userId
    ) {

        alert(
            "⚠️ لا يمكنك الإعجاب بملفك الشخصي"
        );

        return;

    }


    const likeId =
        currentUser.uid +
        "_" +
        userId;


    const likeRef =
        doc(
            db,
            "likes",
            likeId
        );


    try {


        const likeSnapshot =
            await getDoc(
                likeRef
            );


        if (
            likeSnapshot.exists()
        ) {


            await deleteDoc(
                likeRef
            );


            button.textContent =
                "❤️ إعجاب";


        }


        else {


            await setDoc(
                likeRef,
                {

                    from:
                        currentUser.uid,

                    to:
                        userId,

                    createdAt:
                        new Date()

                }
            );


            button.textContent =
                "💗 تم الإعجاب";

        }

    }


    catch(error) {

        console.error(
            "Like Error:",
            error
        );


        alert(
            "❌ حدث خطأ أثناء الإعجاب"
        );

    }

}


/* ==================================================
   عرض المستخدمين
================================================== */

async function showUsers(
    list
) {


    results.innerHTML = "";


    if (
        list.length === 0
    ) {

        results.innerHTML =

            "<p class='no-results'>" +

            "❌ لم نجد أشخاصًا بهذه المواصفات" +

            "</p>";

        return;

    }


    for (
        const user of list
    ) {


        /* إخفاء المستخدم الحالي */

        if (
            currentUser &&
            user.id === currentUser.uid
        ) {

            continue;

        }


        const card =
            document.createElement(
                "div"
            );


        card.className =
            "user-card";


        const userName =
            user.name ||
            "مستخدم";


        const userAge =
            user.age ||
            "غير محدد";


        const userGender =
            user.gender ||
            "غير محدد";


        const userWilaya =
            user.wilaya ||
            "غير محددة";


        const userCity =
            user.city ||
            "";


        const userBio =
            user.bio ||
            "لم تتم إضافة نبذة بعد";


        /* ==================================================
           الصورة
        ================================================== */

        let photoHTML =

            '<div class="user-avatar">👤</div>';


        if (
            user.photo
        ) {

            photoHTML =

                '<img src="' +
                user.photo +
                '" class="user-avatar" alt="صورة المستخدم">';

        }


        /* ==================================================
           بطاقة المستخدم
        ================================================== */

        card.innerHTML = `

            ${photoHTML}

            <h2>
                ${escapeHTML(userName)}
            </h2>

            <p>
                🎂 ${escapeHTML(String(userAge))} سنة
            </p>

            <p>
                🚻 ${escapeHTML(userGender)}
            </p>

            <p>
                📍 ${escapeHTML(userWilaya)}
                ${userCity
                    ? " - " + escapeHTML(userCity)
                    : ""
                }
            </p>

            <div class="user-bio">
                ${escapeHTML(userBio)}
            </div>

            <button
                class="like-user"
                type="button">

                ❤️ إعجاب

            </button>

            <button
                class="contact-user"
                type="button">

                💌 تواصل

            </button>

        `;


        const likeButton =
            card.querySelector(
                ".like-user"
            );


        /* ==================================================
           معرفة الإعجاب السابق
        ================================================== */

        if (currentUser) {

            const likeId =
                currentUser.uid +
                "_" +
                user.id;


            const likeRef =
                doc(
                    db,
                    "likes",
                    likeId
                );


            try {

                const likeSnapshot =
                    await getDoc(
                        likeRef
                    );


                if (
                    likeSnapshot.exists()
                ) {

                    likeButton.textContent =
                        "💗 تم الإعجاب";

                }

            }

            catch(error) {

                console.error(
                    error
                );

            }

        }


        /* ==================================================
           زر الإعجاب
        ================================================== */

        likeButton.addEventListener(
            "click",
            function() {

                likeUser(
                    user.id,
                    likeButton
                );

            }
        );


        /* ==================================================
           زر التواصل
        ================================================== */

        const contactButton =
            card.querySelector(
                ".contact-user"
            );


        contactButton.addEventListener(
            "click",
            function() {


                localStorage.setItem(
                    "chatUser",
                    userName
                );


                localStorage.setItem(
                    "chatUserId",
                    user.id
                );


                window.location.href =
                    "chat.html";

            }
        );


        results.appendChild(
            card
        );

    }

}


/* ==================================================
   حماية النصوص
================================================== */

function escapeHTML(
    value
) {

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* ==================================================
   البحث
================================================== */

function searchUsers() {


    const gender =
        searchGender.value;


    const minimum =
        Number(
            minAge.value
        ) || 18;


    const maximum =
        Number(
            maxAge.value
        ) || 100;


    const wilaya =
        searchWilaya.value;


    if (
        minimum < 18
    ) {

        alert(
            "⚠️ العمر الأدنى يجب أن يكون 18 سنة أو أكثر"
        );

        return;

    }


    if (
        maximum < minimum
    ) {

        alert(
            "⚠️ العمر الأقصى يجب أن يكون أكبر من العمر الأدنى"
        );

        return;

    }


    const filtered =
        users.filter(
            function(user) {


                const userAge =
                    Number(
                        user.age
                    );


                const genderMatch =
                    gender === "" ||
                    user.gender === gender;


                const ageMatch =
                    userAge >= minimum &&
                    userAge <= maximum;


                const wilayaMatch =
                    wilaya === "" ||
                    user.wilaya === wilaya;


                return (

                    genderMatch &&
                    ageMatch &&
                    wilayaMatch

                );

            }
        );


    showUsers(
        filtered
    );

}


/* ==================================================
   زر البحث
================================================== */

searchBtn.addEventListener(
    "click",
    searchUsers
);


/* ==================================================
   تشغيل الصفحة
================================================== */

loadUsers();

</script>


</body>

</html>

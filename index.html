<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>نصيبي 💍</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, Tahoma, sans-serif;
        }

        body {
            min-height: 100vh;
            background:
                linear-gradient(rgba(245, 226, 199, 0.86), rgba(245, 226, 199, 0.92)),
                url("couple.jpg") center/cover fixed;
            color: #5a3b32;
        }

        /* =========================
           القلوب
        ========================= */

        .heart {
            position: fixed;
            color: #d98b9a;
            opacity: 0.45;
            font-size: 25px;
            animation: floatHeart 8s linear infinite;
            pointer-events: none;
            z-index: 0;
        }

        .h1 { right: 5%; animation-delay: 0s; }
        .h2 { right: 25%; animation-delay: 2s; }
        .h3 { right: 50%; animation-delay: 4s; }
        .h4 { right: 75%; animation-delay: 1s; }
        .h5 { right: 90%; animation-delay: 5s; }

        @keyframes floatHeart {
            0% {
                transform: translateY(110vh) rotate(0);
            }

            100% {
                transform: translateY(-120px) rotate(360deg);
            }
        }

        /* =========================
           الهيدر
        ========================= */

        header {
            position: relative;
            z-index: 5;
            background: rgba(91, 59, 50, 0.95);
            color: white;
            padding: 18px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
        }

        header h1 {
            font-size: 30px;
            margin-bottom: 5px;
        }

        header p {
            color: #f8dfe2;
        }

        /* =========================
           الحاوية
        ========================= */

        .container {
            position: relative;
            z-index: 2;
            width: 95%;
            max-width: 1000px;
            margin: 25px auto;
        }

        .box {
            background: rgba(255,255,255,0.93);
            backdrop-filter: blur(10px);
            border-radius: 25px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 10px 35px rgba(75,45,35,0.18);
        }

        .box h2 {
            color: #754c42;
            margin-bottom: 20px;
            text-align: center;
        }

        /* =========================
           معلومات الملف الشخصي
        ========================= */

        .profile-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .field.full {
            grid-column: 1 / -1;
        }

        label {
            font-weight: bold;
            color: #69443a;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 13px;
            border: 2px solid #ead1c4;
            border-radius: 14px;
            background: #fffaf7;
            color: #553932;
            font-size: 15px;
            outline: none;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #d8899a;
            box-shadow: 0 0 0 3px rgba(216,137,154,0.12);
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        /* =========================
           العمر
        ========================= */

        .age-box {
            background: #f9e9e4;
            border-radius: 14px;
            padding: 13px;
            font-weight: bold;
            color: #754c42;
        }

        /* =========================
           الصورة
        ========================= */

        .photo-area {
            text-align: center;
            margin-bottom: 20px;
        }

        #photoPreview {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            object-fit: cover;
            border: 5px solid #e5a6af;
            display: block;
            margin: 10px auto;
            background: #f4dfd5;
        }

        /* =========================
           الاهتمامات
        ========================= */

        .interests {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 10px;
        }

        .interest {
            padding: 9px 14px;
            border-radius: 20px;
            background: #f3e2d5;
            cursor: pointer;
            border: 2px solid transparent;
            transition: 0.2s;
        }

        .interest:hover {
            transform: translateY(-2px);
        }

        .interest.active {
            background: #e6a0ad;
            color: white;
            border-color: #bd7180;
        }

        /* =========================
           الأزرار
        ========================= */

        .main-btn {
            width: 100%;
            border: none;
            padding: 15px;
            border-radius: 15px;
            background: linear-gradient(135deg, #8a5b4d, #bd7180);
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
            transition: 0.2s;
        }

        .main-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 7px 20px rgba(120,70,70,0.25);
        }

        /* =========================
           البحث
        ========================= */

        .search-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .search-full {
            grid-column: 1 / -1;
        }

        /* =========================
           كرت التعارف
        ========================= */

        .cards-area {
            max-width: 450px;
            margin: 30px auto;
        }

        .profile-card {
            background: white;
            border-radius: 30px;
            overflow: hidden;
            box-shadow: 0 15px 40px rgba(67,45,38,0.28);
            position: relative;
            user-select: none;
            touch-action: none;
            transition: transform 0.3s, opacity 0.3s;
        }

        .profile-card img {
            width: 100%;
            height: 430px;
            object-fit: cover;
            display: block;
        }

        .card-info {
            padding: 20px;
        }

        .card-name {
            font-size: 25px;
            font-weight: bold;
            color: #593b33;
        }

        .card-details {
            margin-top: 8px;
            color: #80635b;
            line-height: 1.8;
        }

        .card-bio {
            margin-top: 12px;
            line-height: 1.7;
        }

        .card-interests {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 12px;
        }

        .mini-interest {
            background: #f2dfd6;
            padding: 6px 10px;
            border-radius: 15px;
            font-size: 13px;
        }

        /* =========================
           أزرار السحب
        ========================= */

        .swipe-buttons {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 18px;
            margin-top: 20px;
        }

        .swipe-btn {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            border: none;
            background: white;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            cursor: pointer;
            font-size: 28px;
            transition: 0.2s;
        }

        .swipe-btn:hover {
            transform: scale(1.1);
        }

        .like {
            width: 75px;
            height: 75px;
        }

        /* =========================
           لا توجد نتائج
        ========================= */

        .no-results {
            text-align: center;
            padding: 35px;
            background: #fff;
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.12);
        }

        .no-results div {
            font-size: 55px;
            margin-bottom: 10px;
        }

        /* =========================
           رسائل
        ========================= */

        #message {
            text-align: center;
            font-weight: bold;
            margin-top: 15px;
            color: #754c42;
        }

        /* =========================
           Responsive
        ========================= */

        @media (max-width: 650px) {

            .profile-grid,
            .search-grid {
                grid-template-columns: 1fr;
            }

            .field.full,
            .search-full {
                grid-column: auto;
            }

            .box {
                padding: 18px;
            }

            header h1 {
                font-size: 25px;
            }

            .profile-card img {
                height: 380px;
            }
        }
    </style>
</head>

    /* ==========================================
       بيانات تجريبية

    ========================================== */

        {
            name: "سارة",

            gender: "امرأة",
            wilaya: "باتنة",
            job: "طالبة",
            bio: "شخصية هادئة وأحب التعارف الجاد والاحترام.",
            interests: ["📚 الكتب", "🎬 الأفلام", "🐱 القطط"],

        },

        {
            name: "محمد",
            age: 27,
            birthdate: "1999-02-18",
            gender: "رجل",
            wilaya: "قسنطينة",
            job: "مهندس",
            bio: "أحب الهدوء والسفر وأبحث عن علاقة مبنية على الاحترام.",
            interests: ["✈️ السفر", "💻 البرمجة", "🎵 الموسيقى"],
            image: "https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=800"
        },

        {
            name: "ريم",
            age: 25,
            birthdate: "2001-09-20",
            gender: "امرأة",
            wilaya: "سطيف",
            job: "ممرضة",
            bio: "أحب العائلة والطبخ والبحر وأبحث عن شخص جاد.",
            interests: ["🍳 الطبخ", "🌊 البحر", "🌱 الطبيعة"],
            image: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=800"
        },

        {
            name: "ياسين",
            age: 29,
            birthdate: "1997-01-10",
            gender: "رجل",
            wilaya: "الجزائر",
            job: "مبرمج",
            bio: "أحب البرمجة والأنمي والقراءة وأهتم بالحياة العائلية.",
            interests: ["💻 البرمجة", "🎌 الأنمي", "📚 الكتب"],
            image: "https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=800"
        }

    ];


    let filteredProfiles = [...profiles];

    let currentIndex = 0;


    /* ==========================================
       حساب العمر تلقائياً من تاريخ الميلاد
    ========================================== */

    document
        .getElementById("myBirthdate")
        .addEventListener("change", calculateMyAge);


    function calculateMyAge() {

        const birthdate =
            document.getElementById("myBirthdate").value;

        if (!birthdate) {

            document.getElementById("myAge").textContent =
                "سيتم حساب العمر تلقائياً";

            return;
        }


        const birth = new Date(birthdate);

        const today = new Date();

        let age =
            today.getFullYear() - birth.getFullYear();


        const month =
            today.getMonth() - birth.getMonth();


        if (
            month < 0 ||
            (month === 0 &&
             today.getDate() < birth.getDate())
        ) {

            age--;

        }


        document.getElementById("myAge").textContent =
            age + " سنة";

    }


    /* ==========================================
       اختيار الاهتمامات
    ========================================== */

    document.querySelectorAll(".interest").forEach(item => {

        item.addEventListener("click", () => {

            item.classList.toggle("active");

        });

    });


    /* ==========================================
       صورة المستخدم
    ========================================== */

    document
        .getElementById("photoInput")
        .addEventListener("change", function() {

            const file = this.files[0];

            if (!file) return;


            const reader = new FileReader();


            reader.onload = function(e) {

                document
                    .getElementById("photoPreview")
                    .src = e.target.result;

            };


            reader.readAsDataURL(file);

        });


    /* ==========================================
       حفظ معلومات المستخدم
    ========================================== */

    function saveProfile() {

        const name =
            document.getElementById("myName").value.trim();


        const birthdate =
            document.getElementById("myBirthdate").value;


        const gender =
            document.getElementById("myGender").value;


        const wilaya =
            document.getElementById("myWilaya").value;


        if (!name || !birthdate || !gender || !wilaya) {

            document.getElementById("message").textContent =
                "⚠️ لازم تعمري الاسم وتاريخ الميلاد والجنس والولاية.";

            return;

        }


        const selectedInterests = [];


        document
            .querySelectorAll(".interest.active")
            .forEach(item => {

                selectedInterests.push(
                    item.textContent
                );

            });


        const userProfile = {

            name: name,

            birthdate: birthdate,

            gender: gender,

            wilaya: wilaya,

            age: calculateAgeFromDate(birthdate),

            status:
                document.getElementById("myStatus").value,

            job:
                document.getElementById("myJob").value,

            bio:
                document.getElementById("myBio").value,

            interests:
                selectedInterests,

            image:
                document.getElementById("photoPreview").src

        };


        localStorage.setItem(
            "nasibiProfile",
            JSON.stringify(userProfile)
        );


        document.getElementById("message").textContent =
            "✅ تم حفظ معلوماتك بنجاح 💗";

    }


    /* ==========================================
       حساب العمر
    ========================================== */

    function calculateAgeFromDate(dateString) {

        const birth = new Date(dateString);

        const today = new Date();

        let age =
            today.getFullYear() -
            birth.getFullYear();


        const month =
            today.getMonth() -
            birth.getMonth();


        if (
            month < 0 ||
            (month === 0 &&
             today.getDate() < birth.getDate())
        ) {

            age--;

        }


        return age;

    }


    /* ==========================================
       تحميل معلومات المستخدم إذا كانت محفوظة
    ========================================== */

    function loadProfile() {

        const saved =
            localStorage.getItem("nasibiProfile");


        if (!saved) return;


        const profile =
            JSON.parse(saved);


        document.getElementById("myName").value =
            profile.name || "";


        document.getElementById("myBirthdate").value =
            profile.birthdate || "";


        document.getElementById("myGender").value =
            profile.gender || "";


        document.getElementById("myWilaya").value =
            profile.wilaya || "";


        document.getElementById("myStatus").value =
            profile.status || "";


        document.getElementById("myJob").value =
            profile.job || "";


        document.getElementById("myBio").value =
            profile.bio || "";


        if (profile.image) {

            document.getElementById("photoPreview").src =
                profile.image;

        }


        calculateMyAge();


        document.querySelectorAll(".interest")
            .forEach(item => {

                if (
                    profile.interests &&
                    profile.interests.includes(item.textContent)
                ) {

                    item.classList.add("active");

                }

            });

    }


    /* ==========================================
       البحث
    ========================================== */

    function searchProfiles() {

        const name =
            document
                .getElementById("searchName")
                .value
                .trim()
                .toLowerCase();


        const gender =
            document.getElementById("searchGender").value;


        const wilaya =
            document.getElementById("searchWilaya").value;


        const minAge =
            parseInt(
                document.getElementById("minAge").value
            ) || 0;


        const maxAge =
            parseInt(
                document.getElementById("maxAge").value
            ) || 999;


        filteredProfiles =
            profiles.filter(profile => {


                const nameMatch =
                    !name ||
                    profile.name
                        .toLowerCase()
                        .includes(name);


                const genderMatch =
                    !gender ||
                    profile.gender === gender;


                const wilayaMatch =
                    !wilaya ||
                    profile.wilaya === wilaya;


                const ageMatch =
                    profile.age >= minAge &&
                    profile.age <= maxAge;


                return (
                    nameMatch &&
                    genderMatch &&
                    wilayaMatch &&
                    ageMatch
                );

            });


        currentIndex = 0;

        showCurrentProfile();

    }


    /* ==========================================
       عرض الكرت
    ========================================== */

    function showCurrentProfile() {

        const area =
            document.getElementById("cardsArea");


        if (
            currentIndex >=
            filteredProfiles.length
        ) {

            area.innerHTML = `

                <div class="no-results">

                    <div>💔</div>

                    <h2>
                        ما بقاش أشخاص هنا
                    </h2>

                    <p>
                        جربي تغيّري شروط البحث
                        باش تلقاي أشخاص أكثر.
                    </p>

                </div>

            `;

            return;

        }


        const profile =
            filteredProfiles[currentIndex];


        area.innerHTML = `

            <div
                class="profile-card"
                id="profileCard"
            >

                <img
                    src="${profile.image}"
                    alt="صورة ${profile.name}"
                >


                <div class="card-info">

                    <div class="card-name">

                        ${profile.name},
                        ${profile.age}

                    </div>


                    <div class="card-details">

                        📍 ${profile.wilaya}
                        <br>

                        💼 ${profile.job}

                    </div>


                    <div class="card-bio">

                        ${profile.bio}

                    </div>


                    <div class="card-interests">

                        ${profile.interests
                            .map(i =>
                                `<span class="mini-interest">
                                    ${i}
                                </span>`
                            )
                            .join("")
                        }

                    </div>

                </div>

            </div>


            <div class="swipe-buttons">

                <button
                    class="swipe-btn"
                    onclick="swipeLeft()">

                    ✖

                </button>


                <button
                    class="swipe-btn like"
                    onclick="swipeRight()">

                    ❤️

                </button>


                <button
                    class="swipe-btn"
                    onclick="showDetails()">

                    ⭐

                </button>

            </div>

        `;


        enableSwipe();

    }


    /* ==========================================
       إعجاب
    ========================================== */

    function swipeRight() {

        const card =
            document.getElementById("profileCard");


        if (!card) return;


        card.style.transform =
            "translateX(-500px) rotate(-25deg)";

        card.style.opacity = "0";


        setTimeout(() => {

            currentIndex++;

            showCurrentProfile();

        }, 300);

    }


    /* ==========================================
       رفض / التالي
    ========================================== */

    function swipeLeft() {

        const card =
            document.getElementById("profileCard");


        if (!card) return;


        card.style.transform =
            "translateX(500px) rotate(25deg)";

        card.style.opacity = "0";


        setTimeout(() => {

            currentIndex++;

            showCurrentProfile();

        }, 300);

    }


    /* ==========================================
       التفاصيل
    ========================================== */

    function showDetails() {

        const profile =
            filteredProfiles[currentIndex];


        if (!profile) return;


        alert(

            "💗 معلومات " +
            profile.name +
            "\n\n" +

            "العمر: " +
            profile.age +
            "\n" +

            "الولاية: " +
            profile.wilaya +
            "\n" +

            "الدراسة/العمل: " +
            profile.job +
            "\n\n" +

            "الاهتمامات:\n" +
            profile.interests.join(" ، ")

        );

    }


    /* ==========================================
       السحب بالماوس أو الإصبع
    ========================================== */

    function enableSwipe() {

        const card =
            document.getElementById("profileCard");


        if (!card) return;


        let startX = 0;

        let currentX = 0;

        let dragging = false;


        card.addEventListener("pointerdown", e => {

            dragging = true;

            startX = e.clientX;

            card.setPointerCapture(e.pointerId);

        });


        card.addEventListener("pointermove", e => {

            if (!dragging) return;


            currentX =
                e.clientX - startX;


            card.style.transform =
                `translateX(${currentX}px)
                 rotate(${currentX / 15}deg)`;

        });


        card.addEventListener("pointerup", () => {

            if (!dragging) return;


            dragging = false;


            if (currentX > 120) {

                swipeLeft();

            }

            else if (currentX < -120) {

                swipeRight();

            }

            else {

                card.style.transform =
                    "translateX(0) rotate(0)";

            }


            currentX = 0;

        });

    }


    /* ==========================================
       تشغيل الصفحة
    ========================================== */

    loadProfile();

    showCurrentProfile();

</script>

</body>
</html>
